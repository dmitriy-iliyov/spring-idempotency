# Inside the compose network: every dependency is reached by the name of its compose service.
spring:
  datasource:
    url: ${RIDE_DB_URL:jdbc:postgresql://postgres:5432/rides}
  data:
    redis:
      host: ${RIDE_REDIS_HOST:redis}
  kafka:
    bootstrap-servers: ${RIDE_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  flyway:
    locations: classpath:db/migration,classpath:db/seed

stripe:
  # stripe-mock accepts any test key
  api-key: ${STRIPE_API_KEY:sk_test_123}
  api-base: ${STRIPE_API_BASE:http://stripe-mock:12111}
